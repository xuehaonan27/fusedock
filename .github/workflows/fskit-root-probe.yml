name: fskit-root-probe
on:
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        default: standalone
        options: [standalone, root-no-cache]
        description: Standalone cache calls or native adapter with an uncached root
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Select diagnostic variant
        env:
          PROBE_VARIANT: ${{ inputs.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          if os.environ['PROBE_VARIANT'] == 'standalone':
              shutil.copy('macos/Tests/RootCacheProbe.swift', 'macos/FSKit/FuseDockFSKit/')
              path = Path('macos/FSKit/FuseDockFSKit/FuseDockFileSystem.swift')
              source = path.read_text().replace('let volume: FuseDockFSVolume', 'let volume: FSVolume')
              source = source.replace('volume = try FuseDockCachedFSVolume(configPath: configPath)', 'volume = try RootCacheProbe(configPath: configPath)')
          else:
              path = Path('macos/FSKit/FuseDockFSKit/FuseDockCachedFSVolume.swift')
              source = path.read_text().replace('cacheMode == .none ? .noCache : .readCache', 'cacheMode == .none || item === rootItem ? .noCache : .readCache')
          path.write_text(source)
          PY
      - run: make macos-bridge
      - run: xcodebuild -project macos/FSKit/FuseDockFSKit.xcodeproj -scheme FuseDock -configuration Debug -derivedDataPath /tmp/fusedock-probe CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent /tmp/fusedock-probe/Build/Products/Debug/FuseDock.app /tmp/FuseDock-root-probe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FuseDock-root-probe-${{ inputs.variant }}
          path: /tmp/FuseDock-root-probe.zip
          retention-days: 7
